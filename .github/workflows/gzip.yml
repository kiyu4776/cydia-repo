name: Compress Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gzip -kf repo/Release repo/Packages live.test/Release live.test/Packages
      - run: |
          git config user.name "github-action[gzip]"
          git config user.email ""
          git add -A
          git commit -m "圧縮" || true
          git push
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
